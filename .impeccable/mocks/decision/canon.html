<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Category standard sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;color:#0F172A}
  nav{display:flex;justify-content:space-between;align-items:center;padding:26px 72px}
  .logo{font-weight:800;font-size:26px}.links{display:flex;gap:32px;font-size:17px;font-weight:600;color:#475569}
  .btn{background:#2563EB;color:#fff;font-weight:700;padding:16px 26px;border-radius:12px;font-size:18px}
  main{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:60px 72px}
  h1{font-size:72px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
  p{font-size:23px;color:#475569;line-height:1.5;margin:24px 0 34px}
  .art{background:linear-gradient(135deg,#DBEAFE,#FEF3C7);border-radius:28px;height:520px;position:relative}
  .card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 20px 40px #0F172A1f;padding:20px 24px;font-weight:700;font-size:20px}
</style></head><body>
<nav><div class="logo">Navya Ed Tech</div><div class="links"><span>Courses</span><span>Programs</span><span>Pricing</span><span>About</span></div><span class="btn">Book a free class</span></nav>
<main><section><h1>Coding classes that kids actually enjoy.</h1>
<p>Hands-on Scratch, Python and web development for ages 8 to 16 in Kathmandu.</p>
<span class="btn" style="font-size:20px;padding:20px 30px">Book a free trial class</span></section>
<div class="art"><div class="card" style="left:30px;top:40px">Scratch for ages 8+</div><div class="card" style="right:30px;top:200px">12 kids per class</div><div class="card" style="left:80px;bottom:50px">Python for teens</div></div></main>
</body></html>
